<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>《2049》互动书评</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;500;600&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--ink:#1a1a18;--ink2:#4a4a44;--ink3:#8a8a82;--paper:#faf9f5;--cream:#f0ede4;--line:#ddd9ce;--gold:#b8943a;--gold-bg:#fdf7ea;--blue:#1e3a6e;--blue-l:#dde8f8;--green:#1e5c38;--green-l:#daf0e6;--amber:#7a5a10;--amber-l:#f5e9c8;}
body{background:var(--paper);color:var(--ink);font-family:'Noto Serif SC',serif;min-height:100vh;max-width:700px;margin:0 auto;-webkit-text-size-adjust:100%}
.hdr{padding:clamp(1.25rem,4vw,2.25rem) clamp(1rem,4vw,1.75rem) clamp(1rem,3vw,1.5rem);border-bottom:2.5px solid var(--ink)}
.hdr-eye{font-family:'Space Mono',monospace;font-size:9px;letter-spacing:.2em;color:var(--ink3);margin-bottom:10px;text-transform:uppercase}
.hdr-t{font-size:clamp(20px,5vw,26px);font-weight:600;line-height:1.25}
.hdr-t em{color:var(--gold);font-style:normal}
.hdr-by{font-size:clamp(10px,2.5vw,11px);color:var(--ink3);margin-top:10px;font-family:'Space Mono',monospace;line-height:1.8}
.nav{display:flex;background:var(--cream);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:10}
.nb{flex:1;padding:12px 2px;font-size:clamp(9px,2.5vw,10.5px);font-family:'Space Mono',monospace;background:none;border:none;color:var(--ink3);cursor:pointer;border-bottom:2.5px solid transparent;transition:all .2s;letter-spacing:.02em}
.nb.on{color:var(--ink);border-bottom-color:var(--gold);background:var(--paper)}
.nb:hover:not(.on){color:var(--ink2)}
.panel{display:none;padding:clamp(1rem,4vw,1.75rem)}
.panel.on{display:block;animation:up .3s ease}
@keyframes up{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
.sl{font-family:'Space Mono',monospace;font-size:9px;letter-spacing:.15em;color:var(--gold);margin-bottom:16px;display:flex;align-items:center;gap:8px;text-transform:uppercase}
.sl::after{content:'';flex:1;height:1px;background:var(--line)}
/* METER */
.m-intro{font-size:clamp(12px,3vw,13px);color:var(--ink2);line-height:1.8;margin-bottom:1.25rem;padding:12px 14px;border-left:3px solid var(--gold);background:var(--gold-bg);border-radius:0 4px 4px 0}
.mc{border:1px solid var(--line);border-radius:8px;padding:clamp(.85rem,3vw,1.1rem) clamp(.9rem,3vw,1.25rem);margin-bottom:12px;background:var(--paper)}
.mc-claim{font-size:clamp(12.5px,3.2vw,13.5px);font-weight:500;color:var(--ink);line-height:1.6;margin-bottom:4px}
.mc-src{font-size:9px;color:var(--ink3);font-family:'Space Mono',monospace;margin-bottom:12px}
.m-row{display:flex;align-items:center;gap:8px;margin-bottom:6px}
.m-who{font-size:9px;font-family:'Space Mono',monospace;width:18px;flex-shrink:0}
.m-track{flex:1;height:7px;background:var(--cream);border-radius:4px;border:1px solid var(--line);overflow:hidden}
.m-fill{height:100%;border-radius:4px;transition:width .55s ease}
.m-pct{font-size:10px;font-family:'Space Mono',monospace;width:30px;text-align:right;flex-shrink:0;font-weight:700}
.kk-locked{flex:1;height:7px;background:repeating-linear-gradient(90deg,var(--line) 0,var(--line) 5px,transparent 5px,transparent 10px);border-radius:4px;border:1px solid var(--line)}
.hint-txt{font-size:9px;color:var(--ink3);font-family:'Space Mono',monospace;margin-bottom:3px}
input[type=range]{width:100%;accent-color:var(--gold);cursor:pointer;margin:3px 0;height:20px}
.m-diff{font-size:clamp(11.5px,3vw,12.5px);margin-top:10px;padding:9px 12px;border-radius:5px;line-height:1.65;display:none}
.m-diff.show{display:block}
.m-diff.ag{background:var(--green-l);color:var(--green)}
.m-diff.hi{background:var(--blue-l);color:var(--blue)}
.m-diff.lo{background:var(--amber-l);color:var(--amber)}
/* REVIEW */
.r-intro{font-size:clamp(12px,3vw,13px);color:var(--ink2);line-height:1.85;margin-bottom:1.5rem;padding-bottom:1.25rem;border-bottom:1px solid var(--line)}
.tc{border:1px solid var(--line);border-radius:8px;overflow:hidden;margin-bottom:12px}
.th{display:flex;align-items:center;justify-content:space-between;padding:13px 15px;cursor:pointer;transition:background .15s;user-select:none}
.th:hover{background:var(--cream)}
.th-l{display:flex;align-items:center;gap:11px}
.th-ic{width:30px;height:30px;border-radius:5px;display:flex;align-items:center;justify-content:center;font-size:13px;flex-shrink:0}
.th-nm{font-size:clamp(13px,3.5vw,14px);font-weight:600;color:var(--ink)}
.th-tg{font-size:9px;color:var(--ink3);font-family:'Space Mono',monospace;margin-top:2px}
.th-ar{font-size:11px;color:var(--ink3);transition:transform .25s;flex-shrink:0}
.tb{display:none;border-top:1px solid var(--line);background:var(--paper)}
.tb.open{display:block;animation:up .2s ease}
.ch-ul{list-style:none;padding:10px 15px 4px}
.ch-li{display:flex;gap:10px;padding:7px 0;border-bottom:1px dashed var(--line);font-size:clamp(12px,3vw,13px);color:var(--ink2);line-height:1.5}
.ch-li:last-child{border-bottom:none}
.ch-n{font-family:'Space Mono',monospace;font-size:9px;color:var(--gold);padding-top:3px;min-width:22px;flex-shrink:0}
.rv{margin:10px 15px 15px;padding:13px;border-radius:5px;font-size:clamp(12px,3vw,13px);line-height:1.9}
.rv.empty{background:var(--cream);border:1px dashed var(--line);color:var(--ink3);font-style:italic}
.rv.filled{background:var(--paper);border:1px solid var(--line);color:var(--ink2)}
.rv.filled p{margin-bottom:.9rem;line-height:1.9}
.rv.filled p:last-child{margin-bottom:0}
/* SCENE */
.sc-form{background:var(--cream);border:1px solid var(--line);border-radius:8px;padding:clamp(1rem,4vw,1.5rem);margin-bottom:1.25rem}
.fl{font-size:10px;font-family:'Space Mono',monospace;color:var(--ink3);margin-bottom:6px;letter-spacing:.05em;text-transform:uppercase}
.fi{width:100%;padding:10px 12px;font-size:clamp(13px,3.5vw,13.5px);font-family:'Noto Serif SC',serif;background:var(--paper);border:1px solid var(--line);border-radius:5px;color:var(--ink);outline:none;transition:border-color .2s}
.fi:focus{border-color:var(--gold)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.fr{margin-bottom:12px}
.chip-grid{display:flex;flex-wrap:wrap;gap:7px;margin-top:4px}
.chip{padding:7px 14px;font-size:clamp(11.5px,3vw,12.5px);background:var(--paper);border:1px solid var(--line);border-radius:20px;cursor:pointer;color:var(--ink2);transition:all .15s;user-select:none}
.chip:hover{border-color:var(--gold);background:var(--gold-bg)}
.chip.sel{background:var(--gold-bg);border-color:var(--gold);color:var(--ink);font-weight:500}
.custom-row{display:none;margin-top:8px}
.custom-row.show{display:block}
.gen-btn{width:100%;padding:13px;font-size:clamp(11px,3vw,13px);font-family:'Space Mono',monospace;letter-spacing:.06em;background:var(--ink);color:var(--paper);border:none;border-radius:5px;cursor:pointer;transition:background .15s;margin-top:12px}
.gen-btn:hover{background:var(--ink2)}
.gen-btn:disabled{background:var(--line);color:var(--ink3);cursor:default}
.sc-out{border:1px solid var(--line);border-radius:8px;overflow:hidden;display:none}
.sc-out.show{display:block;animation:up .4s ease}
.sc-hdr{padding:12px 16px;border-bottom:1px solid var(--line);background:var(--cream);display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.sc-name{font-size:clamp(13px,3.5vw,14px);font-weight:600;color:var(--ink)}
.sc-year{font-family:'Space Mono',monospace;font-size:10px;color:var(--gold)}
.sc-body{padding:1.25rem;font-size:clamp(12.5px,3.2vw,13.5px);color:var(--ink2);line-height:2;white-space:pre-wrap}
.sc-quote{margin:0 1.25rem 1.25rem;padding:12px 15px;background:var(--gold-bg);border-left:3px solid var(--gold);border-radius:0 5px 5px 0;font-size:clamp(12px,3vw,13px);color:var(--ink);line-height:1.75;font-style:italic}
.sc-quote strong{font-style:normal;font-size:9px;font-family:'Space Mono',monospace;color:var(--gold);display:block;margin-bottom:5px;letter-spacing:.08em;text-transform:uppercase}
.sc-loading{padding:2rem;text-align:center;font-size:13px;color:var(--ink3);font-family:'Space Mono',monospace}
.dot{display:inline-block;animation:blink 1.2s infinite}
.dot:nth-child(2){animation-delay:.2s}
.dot:nth-child(3){animation-delay:.4s}
@keyframes blink{0%,80%,100%{opacity:0}40%{opacity:1}}
.sc-err{padding:1.25rem;font-size:13px;color:#8a2a2a;background:#f8e8e8;line-height:1.7}
.retry-btn{display:none;margin:1rem auto 0;padding:9px 22px;font-size:12px;font-family:'Space Mono',monospace;background:none;border:1px solid var(--ink);border-radius:4px;cursor:pointer;color:var(--ink)}
.retry-btn:hover{background:var(--ink);color:var(--paper)}
</style>
</head>
<body>
<div class="hdr">
  <div class="hdr-eye">Interactive Book Review · 互动书评</div>
  <div class="hdr-t">《2049：未来<em>10000</em>天的可能》</div>
  <div class="hdr-by">凯文·凯利 著 × 吴晨 编 ／ 中信出版集团 · 2025<br>现在距离2049年还有 <span id="cd" style="color:var(--gold);font-weight:700"></span> 天</div>
</div>
<nav class="nav">
  <button class="nb on" onclick="sw(0)">可能性仪表</button>
  <button class="nb" onclick="sw(1)">我的书评</button>
  <button class="nb" onclick="sw(2)">我的2049</button>
</nav>

<!-- PANEL 0: METER -->
<div class="panel on" id="p0">
  <div class="sl">Meter · 先给出你的判断，再看作者</div>
  <div class="m-intro">拖动滑块给出<strong>你的相信程度</strong>，滑动停止后解锁作者的判断——看看你们差多远。</div>
  <div id="ml"></div>
</div>

<!-- PANEL 1: REVIEW -->
<div class="panel" id="p1">
  <div class="sl">Review · 我的书评</div>
  <div class="r-intro">凯文·凯利作为"数字时代的预言家"，为新中国成立100周年做了预测：人类和AI共生的镜像世界。下面是几个板块的书评：</div>
  <div id="tg"></div>
</div>

<!-- PANEL 2: SCENE -->
<div class="panel" id="p2">
  <div class="sl">Imagine · 你在2049年的一天</div>
  <div class="sc-form">
    <div class="row2">
      <div class="fr">
        <div class="fl">你的职业</div>
        <input class="fi" id="s-job" placeholder="如：律师、老师、程序员...">
      </div>
      <div class="fr">
        <div class="fl">现在的年龄</div>
        <input class="fi" id="s-age" type="number" placeholder="如：25" min="10" max="80">
      </div>
    </div>
    <div class="fr">
      <div class="fl">2049年的你正在</div>
      <div class="chip-grid" id="chip-grid"></div>
      <div class="custom-row" id="custom-row">
        <input class="fi" id="s-custom" placeholder="描述你想象中的场景...">
      </div>
    </div>
    <button class="gen-btn" id="gen-btn" onclick="generate()">推演我的2049年 →</button>
  </div>
  <div class="sc-out" id="sc-out"></div>
  <button class="retry-btn" id="retry-btn" onclick="resetScene()">换一个场景</button>
</div>

<script>
document.getElementById('cd').textContent = Math.floor((new Date('2049-01-01') - new Date()) / 864e5).toLocaleString();

function sw(i) {
  document.querySelectorAll('.nb').forEach((b,j) => b.classList.toggle('on', i===j));
  document.querySelectorAll('.panel').forEach((p,j) => p.classList.toggle('on', i===j));
}

/* ── METER ── */
const MD = [
  {c:'智能眼镜将在2035年前全面取代智能手机，成为主流交互设备',s:'镜像世界章节',kk:75,
   ag:'你和 KK 所见略同。他认为眼镜将把现实与虚拟无缝叠加，手机屏幕终将成为历史——就像键盘没有消失但已不再是核心界面。',
   hi_s:'你比 KK 略乐观，可能已感受到 AR 硬件正在快速进化，认为这一天会比他预测的更早到来。',
   hi_l:'你的判断远超 KK——你认为他低估了硬件小型化的速度和用户对新形态的接受程度。',
   lo_s:'你比 KK 保守，或许认为人类对手机的依赖已形成难以撼动的肌肉记忆，光靠技术进步还不够。',
   lo_l:'你和 KK 存在根本分歧——你可能认为「戴在脸上」的文化阻力和续航问题被严重低估了。'},
  {c:'2049年大多数中层管理岗位消失，AI 完成上传下达与绩效统计',s:'异人智能章节',kk:85,
   ag:'你和 KK 高度一致。他认为 AI 的信息处理效率将让中层失去存在的理由，组织走向极度扁平——不是裁员，而是结构性消失。',
   hi_s:'你比 KK 略乐观，可能认为这场组织变革的速度会超出他的预期，也许你已经在身边看到端倪。',
   hi_l:'你的判断超越 KK——你觉得中层消失不只是趋势，而是已经在部分行业悄然发生的现实。',
   lo_s:'你比 KK 保守，可能认为「人情管理」、政治博弈和责任归属问题会给中层留下持久的生存空间。',
   lo_l:'你和 KK 判断截然相反——你可能认为 AI 在复杂组织决策和人际协调中的局限性被他严重低估了。'},
  {c:'个性化定制药物（3D 药丸机器）将普及至普通家庭',s:'医疗与生命科学章节',kk:70,
   ag:'你和 KK 的判断相近。他认为生物科技成本曲线将复制半导体的路径，最终让定制医疗走进普通家庭——就像打印机一样平常。',
   hi_s:'你比 KK 略乐观，可能更相信技术降本的速度，或者你对监管松绑的预判更积极。',
   hi_l:'你的相信程度远超 KK，认为他低估了生物打印技术的跃升速度和全球医疗体系的开放程度。',
   lo_s:'你比 KK 保守，或许认为医疗利益集团和监管壁垒会大幅拖慢普及进程，远不止到2049年。',
   lo_l:'你与 KK 存在根本分歧——你可能认为定制药物在2049年仍将是少数人的特权，普通家庭还远没到那一步。'},
  {c:'2035年前，大多数知识工作者将有 AI「数字分身」代替处理70%以上的日常工作',s:'AI 助理章节',kk:78,
   ag:'你和 KK 所见略同。他认为 AI 分身是放大而非替代——让人专注于真正需要判断力的工作，重复性任务将大规模外包给 AI。',
   hi_s:'你比 KK 略乐观，可能已在自己的工作中感受到这股浪潮的早期信号，认为70%只是保守估计。',
   hi_l:'你的预判远超 KK——你认为模型能力的跃升速度和企业的采用意愿都比书中描述的更激进。',
   lo_s:'你比 KK 保守，或许认为人类对「真人接触」的需求，以及对 AI 失误的零容忍会形成持久防线。',
   lo_l:'你和 KK 存在根本分歧——你可能认为监管、伦理争议或技术瓶颈会把这个时间线推迟很多年。'},
  {c:'2049年远程工作成为主流，城市中心写字楼将大规模转型为居住或文化空间',s:'组织与城市章节',kk:68,
   ag:'你和 KK 的判断接近。他认为扁平化组织加远程协作将重新定义「上班」，写字楼的没落是城市形态变革的必然缩影。',
   hi_s:'你比 KK 更看好远程工作的未来，认为疫情后留下的习惯改变不可逆，企业近年的回撤只是短暂反弹。',
   hi_l:'你比 KK 乐观得多——你可能认为他低估了年轻一代对通勤的抵触，以及技术对「在场感」的彻底解决。',
   lo_s:'你比 KK 保守，可能认为面对面协作的价值被严重低估，人类社交本能会把大家拉回办公室。',
   lo_l:'你和 KK 在这条预言上判断截然相反——你可能认为新产业需求和城市规划惯性会让写字楼找到新的理由继续存在。'},
];

const timers = {};
function getComment(m, diff) {
  if (Math.abs(diff) <= 8)      return {cls:'ag', txt: m.ag};
  if (diff > 8 && diff <= 20)   return {cls:'hi', txt: m.hi_s};
  if (diff > 20)                return {cls:'hi', txt: m.hi_l};
  if (diff < -8 && diff >= -20) return {cls:'lo', txt: m.lo_s};
  return {cls:'lo', txt: m.lo_l};
}

const ml = document.getElementById('ml');
MD.forEach((m, i) => {
  const el = document.createElement('div'); el.className = 'mc';
  el.innerHTML = `
    <div class="mc-claim">${m.c}</div>
    <div class="mc-src">— ${m.s}</div>
    <div class="m-row">
      <span class="m-who" style="color:var(--blue)">我</span>
      <div class="m-track"><div class="m-fill" id="my${i}" style="width:0%;background:var(--blue)"></div></div>
      <span class="m-pct" id="mv${i}" style="color:var(--blue)">—</span>
    </div>
    <div class="m-row">
      <span class="m-who" style="color:var(--gold)">KK</span>
      <div class="kk-locked" id="klb${i}"></div>
      <div class="m-track" id="ktr${i}" style="display:none"><div class="m-fill" id="kf${i}" style="width:0%;background:var(--gold)"></div></div>
      <span class="m-pct" id="kv${i}" style="color:#ccc">?%</span>
    </div>
    <div class="hint-txt">拖动滑块，停止后解锁 KK 的预测</div>
    <input type="range" min="0" max="100" value="50"
      oninput="onInput(${i},this.value)" onchange="onStop(${i},this.value)">
    <div class="m-diff" id="md${i}"></div>`;
  ml.appendChild(el);
});

function onInput(i, v) {
  v = parseInt(v);
  document.getElementById('my'+i).style.width = v+'%';
  document.getElementById('mv'+i).textContent = v+'%';
  document.getElementById('klb'+i).style.display = 'block';
  document.getElementById('ktr'+i).style.display = 'none';
  document.getElementById('kv'+i).textContent = '?%';
  document.getElementById('kv'+i).style.color = '#ccc';
  document.getElementById('md'+i).className = 'm-diff';
  clearTimeout(timers[i]);
  timers[i] = setTimeout(() => onStop(i, v), 700);
}

function onStop(i, v) {
  v = parseInt(v);
  clearTimeout(timers[i]);
  document.getElementById('klb'+i).style.display = 'none';
  document.getElementById('ktr'+i).style.display = 'block';
  setTimeout(() => { document.getElementById('kf'+i).style.width = MD[i].kk+'%'; }, 50);
  document.getElementById('kv'+i).textContent = MD[i].kk+'%';
  document.getElementById('kv'+i).style.color = 'var(--gold)';
  const diff = v - MD[i].kk;
  const {cls, txt} = getComment(MD[i], diff);
  const label = diff > 0 ? `你比 KK 更乐观（+${diff}%）` : diff === 0 ? '你和 KK 判断完全一致' : `你比 KK 更保守（${diff}%）`;
  const d = document.getElementById('md'+i);
  d.className = 'm-diff show ' + cls;
  d.innerHTML = `<strong>${label}</strong><br>${txt}`;
}

/* ── REVIEW ── */
const TH = [
  {
    ic:'🌐',bg:'#daf0e6',fg:'#1e5c38',nm:'镜像世界与数字现实',tg:'MIRROR WORLD',
    chs:[{n:'01',t:'镜像世界——下一代互联网的崛起'},{n:'02',t:'智能眼镜如何取代智能手机'},{n:'03',t:'互见性与数据伦理'},{n:'04',t:'透明社会——数据驱动的未来'}],
    rv:`<p>全书的开头就描写了最具画面感的部分：智能眼镜会打造一个数字世界，当数十亿人戴上眼镜，现实世界中，你看到的每一面墙、每一条街道，都可以附着信息层、导航层、甚至社交层。</p>

const tg = document.getElementById('tg');
TH.forEach((t, i) => {
  const chs = t.chs.map(c => `<li class="ch-li"><span class="ch-n">${c.n}</span><span>${c.t}</span></li>`).join('');
  const rv = t.rv ? `<div class="rv filled">${t.rv}</div>` : `<div class="rv empty">${t.ph}</div>`;
  const div = document.createElement('div'); div.className = 'tc';
  div.innerHTML = `<div class="th" onclick="tog(${i})"><div class="th-l"><div class="th-ic" style="background:${t.bg};color:${t.fg}">${t.ic}</div><div><div class="th-nm">${t.nm}</div><div class="th-tg">${t.tg}</div></div></div><span class="th-ar" id="ar${i}">▼</span></div><div class="tb" id="tb${i}"><ul class="ch-ul">${chs}</ul>${rv}</div>`;
  tg.appendChild(div);
});

function tog(i) {
  const b = document.getElementById('tb'+i);
  const a = document.getElementById('ar'+i);
  b.classList.toggle('open');
  a.style.transform = b.classList.contains('open') ? 'rotate(180deg)' : '';
}

/* ── SCENE ── */
const SCENES = [
  {label:'🛋️ 在家躺平', prompt:'在家躺平，AI助理全权打理工作，自己几乎不需要动手', travel:false},
  {label:'☕ 喝咖啡', prompt:'在咖啡馆悠闲喝咖啡，用眼神操控智能眼镜处理事务', travel:false},
  {label:'🚇 牛马通勤', prompt:'挤在自动驾驶通勤车厢里，和AI助理开早会', travel:false},
  {label:'🌏 海外旅居', prompt:'在某个海外城市旅居，过着数字游民的生活', travel:false},
  {label:'🏃 健身运动', prompt:'在智能健身房运动，可穿戴设备实时监测全身数据', travel:false},
  {label:'🏥 医院体检', prompt:'在医院做AI驱动的年度深度体检，基因检测和定制药方', travel:false},
  {label:'⏰ 穿越了', prompt:'意外从2049年穿越回2025年，用未来人的眼光看现在的一切', travel:true},
  {label:'✏️ 自己填', prompt:'', travel:false},
];

let selectedScene = null;

const chipGrid = document.getElementById('chip-grid');
SCENES.forEach(s => {
  const chip = document.createElement('div');
  chip.className = 'chip';
  chip.textContent = s.label;
  chip.onclick = () => {
    document.querySelectorAll('.chip').forEach(c => c.classList.remove('sel'));
    chip.classList.add('sel');
    const customRow = document.getElementById('custom-row');
    if (s.label === '✏️ 自己填') {
      customRow.classList.add('show');
      selectedScene = null;
    } else {
      customRow.classList.remove('show');
      selectedScene = s;
    }
  };
  chipGrid.appendChild(chip);
});

const WORKER = 'https://flat-sunset-80bc.cclairy36.workers.dev';

async function generate() {
  const job = document.getElementById('s-job').value.trim();
  const age = parseInt(document.getElementById('s-age').value) || 25;
  const custom = document.getElementById('s-custom').value.trim();

  if (!job) { document.getElementById('s-job').focus(); return; }
  if (!selectedScene && !custom) {
    chipGrid.style.outline = '1.5px solid var(--gold)';
    setTimeout(() => chipGrid.style.outline = '', 1000);
    return;
  }

  const ageIn2049 = age + 25;
  const sceneLabel = selectedScene ? selectedScene.label : custom;
  const scenePrompt = selectedScene ? selectedScene.prompt : custom;
  const isTimeTravel = selectedScene && selectedScene.travel;

  const btn = document.getElementById('gen-btn');
  btn.disabled = true; btn.textContent = '推演中...';
  const out = document.getElementById('sc-out');
  out.className = 'sc-out show';
  out.innerHTML = `<div class="sc-loading">正在打开2049年的时间胶囊<span class="dot">.</span><span class="dot">.</span><span class="dot">.</span></div>`;
  document.getElementById('retry-btn').style.display = 'none';

  const prompt = isTimeTravel
    ? `你是一个幽默又有洞察力的未来观察者，熟读《2049：未来10000天的可能》（凯文·凯利著）。

请写一个场景：一个${ageIn2049}岁的${job}，从2049年意外穿越回2025年，用未来人的眼光看现在的一切。

要求：
1. 200字以内，有画面感，写出强烈的反差感——2049年习以为常的东西，在2025年显得多么原始可笑
2. 语气幽默，带调侃，像一个从未来回来的人第一次看到手机、地铁、办公室时的震惊
3. 根据职业埋入1-2个专属细节和梗
4. 用第二人称「你」叙述
5. 结束后空一行，写一句「2049年的你说：……」，针对${job}职业，真诚中带调侃，结尾要透露出2049年的你已经财务自由、不再为钱发愁，20字以内，让人看完想转发

格式：
[场景正文]

「2049年的你说：……」`
    : `你是一个幽默又有洞察力的未来观察者，熟读《2049：未来10000天的可能》（凯文·凯利著）。

请为下面这个人写2049年的一个场景：

人物：${job}，${ageIn2049}岁（现在${age}岁）
场景：${scenePrompt}

要求：
1. 200字以内，有具体画面感，天马行空但有内在逻辑，自然融入书中1-2个概念（镜像世界/智能眼镜/AI助理/扁平化组织/定制医疗/互见性等）
2. 语气轻松幽默，带一点调侃，像一个聪明朋友描述未来，不要太科幻腔
3. 根据职业和场景埋入1-2个有意思的反差细节或梗，写出25年后「现在的你 vs 2049年的你」的对比
4. 用第二人称「你」叙述
5. 结束后空一行，写一句「2049年的你说：……」，针对职业+场景，真诚中带调侃，结尾要透露出2049年的你已经财务自由、不再为钱发愁，20字以内，让人看完想转发

格式：
[场景正文]

「2049年的你说：……」`;

  try {
    const res = await fetch(WORKER, {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({model:'claude-sonnet-4-20250514', max_tokens:800, messages:[{role:'user', content:prompt}]})
    });
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    const data = await res.json();
    if (data.error) throw new Error(data.error.message || '生成失败');
    const full = data.content?.find(b => b.type === 'text')?.text || '';

    const quoteMatch = full.match(/「2049年的你说[：:]\s*([\s\S]+?)」/);
    const quote = quoteMatch ? quoteMatch[1].trim() : '';
    const sceneText = full.replace(/「2049年的你说[：:][\s\S]+?」/, '').trim();

    out.innerHTML = `
      <div class="sc-hdr">
        <span class="sc-name">${job}，${ageIn2049}岁</span>
        <span class="sc-year">· ${sceneLabel} · 2049年</span>
      </div>
      <div class="sc-body">${sceneText}</div>
      ${quote ? `<div class="sc-quote"><strong>2049年的你说</strong>${quote}</div>` : ''}`;
    document.getElementById('retry-btn').style.display = 'block';
  } catch(e) {
    out.innerHTML = `<div class="sc-err">生成失败：${e.message}。请稍后重试。</div>`;
  }
  btn.disabled = false;
  btn.textContent = '推演我的2049年 →';
}

function resetScene() {
  document.getElementById('sc-out').className = 'sc-out';
  document.getElementById('retry-btn').style.display = 'none';
  document.getElementById('s-job').value = '';
  document.getElementById('s-age').value = '';
  document.getElementById('s-custom').value = '';
  document.getElementById('custom-row').classList.remove('show');
  selectedScene = null;
  document.querySelectorAll('.chip').forEach(c => c.classList.remove('sel'));
  document.getElementById('gen-btn').textContent = '推演我的2049年 →';
}
</script>
